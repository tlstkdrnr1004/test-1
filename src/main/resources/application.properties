#\uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uD3EC\uD2B8 \uC124\uC815
#\uB530\uB85C \uC124\uC815\uD558\uC9C0 \uC54A\uC73C\uBA74 \uAE30\uBCF8 \uD3EC\uD2B8\uBC88\uD638\uB294 8080\uC785\uB2C8\uB2E4.
#80 \uD3EC\uD2B8\uBC88\uD638\uB294 url \uB4A4\uC5D0 \uD3EC\uD2B8 \uBC88\uD638\uB97C \uC0DD\uB7B5\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
server.port=8081

#MySQL \uC5F0\uACB0 \uC124\uC815
#1.\uB370\uC774\uD130\uBCA0\uC774\uC2A4\uC5D0 \uC5F0\uACB0\uD558\uAE30 \uC704\uD574 \uB4DC\uB77C\uC774\uBC84 \uD074\uB798\uC2A4 \uACBD\uB85C \uC124\uC815
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#2.\uC5F0\uACB0\uD560 \uB370\uC774\uD130\uBCA0\uC774\uC2A4\uC758 URL, \uD3EC\uD2B8\uBC88\uD638, \uB370\uC774\uD130\uBCA0\uC774\uC2A4\uC758 \uC774\uB984 \uC124\uC815
spring.datasource.url=jdbc:mysql://localhost:3306/shop?serverTimezone=UTC

#3.\uC811\uC18D \uACC4\uC815,\uBE44\uBC00\uBC88\uD638 \uC124\uC815
spring.datasource.username=root
spring.datasource.password=0000

#\uC2E4\uD589\uB418\uB294 \uCFFC\uB9AC \uCF58\uC194 \uCD9C\uB825
spring.jpa.properties.hibernate.show_sql=true

#\uCF58\uC194\uCC3D\uC5D0 \uCD9C\uB825\uB418\uB294 \uCFFC\uB9AC\uB97C \uAC00\uB3C5\uC131\uC774 \uC88B\uAC8C \uD3EC\uB9F7\uD305
spring.jpa.properties.hibernate.format_sql=true

#\uCFFC\uB9AC\uC5D0 \uBB3C\uC74C\uD45C\uB85C \uCD9C\uB825\uB418\uB294 \uBC14\uC778\uB4DC \uD30C\uB77C\uBBF8\uD130 \uCD9C\uB825
logging.level.org.hibernate.type.descriptor.sql=trace

#\uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uD14C\uC774\uBE14 \uC0DD\uC131 \uCD08\uAE30\uD654 \uC804\uB7B5-DDL Auto\uC635\uC158 ?
#\uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uAD6C\uB3D9 \uC2DC JPA\uC758 \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uCD08\uAE30\uD654 \uC804\uB7B5\uC744 \uC124\uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
#\uCD1D 5\uAC00\uC9C0 \uC124\uC815 \uAC12
#none : \uC0AC\uC6A9\uD558\uC9C0 \uC54A\uC74C
#create : \uAE30\uC874 \uD14C\uC774\uBE14 \uC0AD\uC81C \uD6C4 \uD14C\uC774\uBE14 \uB2E4\uC2DC \uC0DD\uC131
#create-drop : \uAE30\uC874 \uD14C\uC774\uBE14 \uC0AD\uC81C \uD6C4 \uD14C\uC774\uBE14 \uB2E4\uC2DC \uC0DD\uC131 - \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC885\uB8CC \uC2DC\uC810\uC5D0 \uD14C\uC774\uBE14 \uC0AD\uC81C
#update : \uC5D4\uD2F0\uD2F0 \uD074\uB798\uC2A4\uC5D0 \uBCC0\uC218 \uCD94\uAC00\uC2DC \uCD94\uAC00\uC2DC\uD0A8 \uBCC0\uC218\uB9CC \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uB0B4\uBD80\uC758 \uD14C\uC774\uBE14\uC5D0 \uCEEC\uB7FC \uCD94\uAC00 \uC0DD\uC131 \uD6C4 \uBC18\uC601\uB418\uAC8C \uC124\uC815 (\uCEEC\uB7FC \uC0AD\uC81C\uB294 \uBC18\uC601 \uC548\uB428)
#validate : \uAC1C\uBC1C \uC885\uB8CC \uD6C4 \uC560\uD50C\uB9AC\uCF00\uC774\uC158\uC744 \uBC30\uD3EC \uD558\uC5EC \uC6B4\uC601\uD658\uACBD \uC11C\uBC84\uC5D0\uC11C \uC5D4\uD2F0\uD2F0\uC640 \uD14C\uC774\uBE14 \uC815\uC0C1 \uB9E4\uD551 \uD655\uC778 \uC6A9 \uAC12 \uC124\uC815
#\uCC38\uACE0. \uAC1C\uBC1C \uCD08\uAE30\uC5D0\uB294 create \uB610\uB294 update \uAC12\uC744 \uC774\uC6A9\uD574\uC11C \uC775\uC219\uD574 \uC9C0\uB294 \uB370 \uC9D1\uC911\uD558\uACE0 \uCD94\uD6C4\uC5D0 validate \uAC12 \uC124\uC815\uD574 \uC8FC\uB294 \uAC83\uC774 \uC88B\uC2B5\uB2C8\uB2E4.
#     \uC2A4\uD14C\uC774\uC9D5 \uD658\uACBD(\uC6B4\uC601 \uD658\uACBD\uC5D0 \uC571\uC744 \uBC30\uD3EC\uD558\uAE30 \uC804\uC758 \uC571 \uD14C\uC2A4\uD2B8 \uC11C\uBC84 \uD658\uACBD)\uACFC  \uC6B4\uC601 \uD658\uACBD\uC5D0\uC11C\uB294 \uC808\uB300\uB85C create, create-drop, update \uAC12\uC744 \uC0AC\uC6A9\uD558\uBA74 \uC548 \uB429\uB2C8\uB2E4.
spring.jpa.hibernate.ddl-auto=update

#SQL\uC740 \uD45C\uC900 SQL\uACFC DBMS\uD68C\uC0AC\uB4E4 \uAC01\uAC01\uC5D0\uC11C \uC81C\uACF5\uD558\uB294 \uACE0\uAE09 SQL\uC774 \uC874\uC7AC\uD569\uB2C8\uB2E4.
#\uAC01 DBMS\uD68C\uC0AC\uC5D0\uC11C \uB9CC\uB4E0 SQL\uC744 \uBC29\uC5B8(Dialect)\uC774\uB77C\uACE0 \uC0DD\uAC01\uD558\uBA74 \uB429\uB2C8\uB2E4.
#MySQL8Dialect \uAC12 \uC124\uC815\uC740 MySQL \uACE0\uAE09 SQL\uB85C \uC0AC\uC6A9\uD558\uACA0\uB2E4\uACE0 \uC124\uC815\uD558\uB294 \uAC12\uC785\uB2C8\uB2E4.
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#Live Reload \uAE30\uB2A5 \uD65C\uC131\uD654
spring.devtools.livereload.enabled=true

#Thymeleaf cache \uC0AC\uC6A9 \uC911\uC9C0
spring.thymeleaf.cache=false

#\uC774\uBBF8\uC9C0 \uD30C\uC77C\uC744 \uB4F1\uB85D\uD560 \uB54C \uC11C\uBC84\uC5D0\uC11C \uAC01 \uD30C\uC77C\uC758 \uCD5C\uB300 \uC0AC\uC774\uC988\uC640 \uD55C\uBC88\uC5D0 \uB2E4\uC6B4 \uC694\uCCAD\uD560\uC218 \uC788\uB294 \uD30C\uC77C\uC758 \uD06C\uAE30\uB97C \uC9C0\uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
#\uB610\uD55C \uCEF4\uD4E8\uD130\uC5D0\uC11C \uC5B4\uB5A4 \uACBD\uB85C\uC5D0 \uC800\uC7A5\uD560\uC9C0\uB97C \uAD00\uB9AC\uD558\uAE30 \uC704\uD574\uC11C itemImgLocation\uC744 \uCD94\uAC00 \uD558\uACA0\uC2B5\uB2C8\uB2E4.

#\uD30C\uC77C \uD55C \uAC1C\uB2F9 \uCD5C\uB300 \uC0AC\uC774\uC988
spring.servlet.multipart.maxFileSize=20MB

#\uC694\uCCAD\uB2F9 \uCD5C\uB300 \uD30C\uC77C \uD06C\uAE30
spring.servlet.multipart.maxRequestSize=100MB

#\uC0C1\uD488 \uC774\uBBF8\uC9C0 \uC5C5\uB85C\uB4DC \uACBD\uB85C
itemImgLocation=./shop-uploads/item

#\uB9AC\uC18C\uC2A4 \uC5C5\uB85C\uB4DC \uACBD\uB85C
uploadPath=file:./shop-uploads/

#\uAE30\uBCF8 batch size \uC124\uC815
spring.jpa.properties.hibernate.default_batch_fetch_size=1000